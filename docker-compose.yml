services:
  mysql:
    image: mysql:8.0
    container_name: ride-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ridedispatch
    ports:
      - "3307:3306"   # 3307 on host so it does not clash with a local MySQL
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d   # runs 01..04 .sql files on first start only
    command: --default-authentication-plugin=mysql_native_password
  redis:
    image: redis:7
    container_name: ride-redis
    ports:
      - "6379:6379"
  chroma:
    image: chromadb/chroma:latest
    container_name: ride-chroma
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/data
volumes:
  mysqldata:
  chromadata:
